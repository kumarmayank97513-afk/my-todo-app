<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayank Kumar | Full-Stack Developer</title>
    <!-- Google Site Verification Meta Tag (SEO & Google Indexing) -->
    <meta name="google-site-verification" content="mixFVxIqspVfyZM3620hvgXa7aNyTpt_7aWt4ngHK_w" />
    
    <!-- React, ReactDOM, Babel & Tailwind CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        // 1. Hero Component
        function Hero() {
            return (
                <section className="text-center py-12 px-4 border-b border-slate-800">
                    <div className="w-24 h-24 bg-sky-500 rounded-full mx-auto flex items-center justify-center text-3xl font-bold text-slate-950 mb-4 shadow-lg shadow-sky-500/20">
                        MK
                    </div>
                    <h1 className="text-3xl font-extrabold text-white sm:text-4xl">
                        Mayank Kumar
                    </h1>
                    <p className="text-sky-400 font-medium mt-1">Full-Stack Web Developer</p>
                    <p className="text-slate-400 text-sm mt-3 max-w-md mx-auto">
                        मैं HTML, CSS, Tailwind, JavaScript और React.js का इस्तेमाल करके मॉडर्न वेब एप्लिकेशन्स बनाता हूँ।
                    </p>
                    <div className="mt-6 flex justify-center gap-3">
                        <a href="#projects" className="bg-sky-500 hover:bg-sky-400 text-slate-950 px-5 py-2 rounded-xl font-bold text-sm transition">
                            प्रोजेक्ट्स देखें
                        </a>
                        <a href="#contact" className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-5 py-2 rounded-xl font-bold text-sm border border-slate-700 transition">
                            संपर्क करें
                        </a>
                    </div>
                </section>
            );
        }

        // 2. Skills Component
        function Skills() {
            const skillsList = ['HTML5', 'CSS3', 'Tailwind CSS', 'JavaScript (ES6)', 'React.js', 'Fetch API', 'GitHub'];
            return (
                <section id="skills" className="py-10 px-4 border-b border-slate-800 max-w-2xl mx-auto">
                    <h2 className="text-xl font-bold text-sky-400 mb-4 text-center">My Tech Stack</h2>
                    <div className="flex flex-wrap justify-center gap-2">
                        {skillsList.map((skill, index) => (
                            <span key={index} className="bg-slate-900 border border-slate-800 text-slate-300 text-xs px-3.5 py-2 rounded-xl font-medium">
                                ⚡ {skill}
                            </span>
                        ))}
                    </div>
                </section>
            );
        }

        // 3. Project Card Component
        function ProjectCard({ project, onOpenModal }) {
            return (
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between hover:border-sky-500/50 transition">
                    <div>
                        <h3 className="text-lg font-bold text-white mb-1">{project.title}</h3>
                        <p className="text-slate-400 text-xs mb-3 leading-relaxed">{project.desc}</p>
                        <div className="flex flex-wrap gap-1.5 mb-4">
                            {project.tech.map((t, idx) => (
                                <span key={idx} className="text-[10px] bg-slate-800 text-sky-300 px-2 py-0.5 rounded-md">
                                    {t}
                                </span>
                            ))}
                        </div>
                    </div>
                    <button 
                        onClick={() => onOpenModal(project)}
                        className="w-full bg-slate-800 hover:bg-sky-500 hover:text-slate-950 text-slate-200 text-xs py-2 rounded-xl font-semibold border border-slate-700 transition">
                        View Details 🔍
                    </button>
                </div>
            );
        }

        // --- Demo Widgets Component (लाइव डेमो दिखाने के लिए) ---
        function WeatherDemo() {
            const [city, setCity] = React.useState('Agra');
            const [temp, setTemp] = React.useState('32°C');
            const [condition, setCondition] = React.useState('Sunny ☀️');

            const handleSearch = () => {
                if(!city) return;
                setTemp('29°C');
                setCondition('Partly Cloudy ⛅');
            };

            return (
                <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700 text-center my-4">
                    <p className="text-xs text-sky-400 mb-2 font-semibold">☀️ Weather App Widget (Live Interactive)</p>
                    <div className="flex gap-2 mb-3">
                        <input 
                            type="text" 
                            value={city} 
                            onChange={(e) => setCity(e.target.value)}
                            className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white flex-1"
                        />
                        <button onClick={handleSearch} className="bg-sky-500 text-slate-950 font-bold px-3 text-xs rounded-lg">
                            Search
                        </button>
                    </div>
                    <div className="bg-slate-900 p-3 rounded-lg">
                        <h4 className="text-lg font-bold text-white">{city}</h4>
                        <p className="text-2xl font-extrabold text-amber-400 my-1">{temp}</p>
                        <p className="text-xs text-slate-400">{condition}</p>
                    </div>
                </div>
            );
        }

        function TodoDemo() {
            const [todos, setTodos] = React.useState(['HTML & CSS सीखना', 'React Portfolio बनाना']);
            const [input, setInput] = React.useState('');

            const addTodo = () => {
                if(!input.trim()) return;
                setTodos([...todos, input]);
                setInput('');
            };

            return (
                <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700 my-4">
                    <p className="text-xs text-sky-400 mb-2 font-semibold text-center">📝 To-Do List Widget (Live Interactive)</p>
                    <div className="flex gap-2 mb-3">
                        <input 
                            type="text" 
                            placeholder="नया टास्क..." 
                            value={input} 
                            onChange={(e) => setInput(e.target.value)}
                            className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white flex-1"
                        />
                        <button onClick={addTodo} className="bg-emerald-500 text-slate-950 font-bold px-3 text-xs rounded-lg">
                            Add
                        </button>
                    </div>
                    <ul className="space-y-1.5 max-h-32 overflow-y-auto">
                        {todos.map((t, i) => (
                            <li key={i} className="bg-slate-900 px-3 py-1.5 rounded-lg text-xs flex justify-between items-center border border-slate-800">
                                <span>{i+1}. {t}</span>
                                <span className="text-emerald-400 text-[10px]">✓ Done</span>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        // 4. Modal / Popup Component
        function ProjectModal({ project, onClose }) {
            const [showLiveDemo, setShowLiveDemo] = React.useState(false);

            if (!project) return null;

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-md w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
                        <button 
                            onClick={onClose}
                            className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-lg">
                            ✕
                        </button>

                        <h3 className="text-xl font-bold text-sky-400 mb-2">{project.title}</h3>
                        <p className="text-slate-300 text-xs mb-4 leading-relaxed">{project.fullDetails}</p>

                        {/* अगर यूज़र ने Live Demo बटन दबाया तो यहीं ऐप का वर्किंग मॉडल खुलेगा */}
                        {showLiveDemo && (
                            <div>
                                {project.type === 'weather' && <WeatherDemo />}
                                {project.type === 'todo' && <TodoDemo />}
                                {project.type === 'portfolio' && (
                                    <div className="bg-slate-800 p-3 rounded-lg text-center text-xs text-emerald-400 my-4">
                                        🚀 आप अभी इसी मयंक के लाइव पोर्टफोलियो ऐप को ही एक्सपीरियंस कर रहे हैं!
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="mb-6 mt-2">
                            <h4 className="text-xs font-semibold text-slate-400 mb-2">इस्तेमाल की गई तकनीक (Tech Used):</h4>
                            <div className="flex flex-wrap gap-1.5">
                                {project.tech.map((t, idx) => (
                                    <span key={idx} className="text-[10px] bg-slate-800 text-sky-300 px-2 py-1 rounded-md border border-slate-700">
                                        {t}
                                    </span>
                                ))}
                            </div>
                        </div>

                        <div className="flex gap-3">
                            <button 
                                onClick={() => setShowLiveDemo(!showLiveDemo)} 
                                className="flex-1 bg-sky-500 hover:bg-sky-400 text-slate-950 text-center font-bold text-xs py-2.5 rounded-xl transition">
                                {showLiveDemo ? 'Hide Demo ✖' : 'Live Demo 🚀'}
                            </button>
                            <a 
                                href={project.githubUrl} 
                                target="_blank" 
                                className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-center font-bold text-xs py-2.5 rounded-xl border border-slate-700 transition flex items-center justify-center">
                                GitHub Code 💻
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        // 5. Projects Showcase Section
        function Projects({ onOpenModal }) {
            const myProjects = [
                {
                    type: 'weather',
                    title: 'Live Weather App',
                    desc: 'Fetch API का उपयोग करके रियल-टाइम तापमान और मौसम अपडेट दिखाने वाला ऐप।',
                    fullDetails: 'यह ऐप OpenWeatherMap API से जुड़कर लाइव डेटा प्राप्त करता है। नीचे "Live Demo 🚀" पर क्लिक करके आप इसे यहीं चलाकर देख सकते हैं!',
                    tech: ['HTML', 'CSS', 'JavaScript', 'Fetch API'],
                    githubUrl: 'https://github.com/kumarmayank97513-afk/my-todo-app'
                },
                {
                    type: 'todo',
                    title: 'To-Do List (LocalStorage)',
                    desc: 'ब्राउज़र लोकल स्टोरेज में स्थायी डेटा सेव करने वाला React To-Do ऐप।',
                    fullDetails: 'इस ऐप में यूजर अपने रोजमर्रा के टास्क ऐड और डिलीट कर सकता है। नीचे "Live Demo 🚀" पर क्लिक करके नया टास्क जोड़कर देखें!',
                    tech: ['React.js', 'Tailwind CSS', 'LocalStorage'],
                    githubUrl: 'https://github.com/kumarmayank97513-afk/my-todo-app'
                },
                {
                    type: 'portfolio',
                    title: 'MAYANK.DEV Portfolio',
                    desc: 'मेरा पर्सनल डेवलपर पोर्टफोलियो जो React कंपोनेंट्स और dynamic UI पर बना है।',
                    fullDetails: 'यह एक फुली मॉड्यूलर और रिस्पॉन्सिव पोर्टफोलियो है जो React state, dynamic project modals, और form handling की क्षमता रखता है।',
                    tech: ['React.js', 'Tailwind CSS', 'GitHub Pages'],
                    githubUrl: 'https://github.com/kumarmayank97513-afk/my-todo-app'
                }
            ];

            return (
                <section id="projects" className="py-10 px-4 border-b border-slate-800 max-w-2xl mx-auto">
                    <h2 className="text-xl font-bold text-sky-400 mb-6 text-center">Featured Projects</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {myProjects.map((p, index) => (
                            <ProjectCard key={index} project={p} onOpenModal={onOpenModal} />
                        ))}
                    </div>
                </section>
            );
        }

        // 6. Contact Form Component
        function Contact() {
            const [formData, setFormData] = React.useState({ name: '', email: '', message: '' });
            const [submitted, setSubmitted] = React.useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if(formData.name && formData.message) {
                    setSubmitted(true);
                }
            };

            return (
                <section id="contact" className="py-10 px-4 max-w-md mx-auto">
                    <h2 className="text-xl font-bold text-sky-400 mb-2 text-center">Get In Touch</h2>
                    <p className="text-slate-400 text-xs text-center mb-6">मुझसे संपर्क करने के लिए नीचे फ़ॉर्म भरें</p>

                    {submitted ? (
                        <div className="bg-emerald-500/10 border border-emerald-500/30 p-4 rounded-xl text-center text-emerald-400 text-sm">
                            ✅ धन्यवाद {formData.name}! आपका मैसेज प्राप्त हो गया है।
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <input 
                                type="text" 
                                placeholder="आपका नाम" 
                                value={formData.name}
                                onChange={(e) => setFormData({...formData, name: e.target.value})}
                                className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500"
                                required 
                            />
                            <input 
                                type="email" 
                                placeholder="ईमेल आईडी" 
                                value={formData.email}
                                onChange={(e) => setFormData({...formData, email: e.target.value})}
                                className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500"
                                required 
                            />
                            <textarea 
                                placeholder="आपका संदेश..." 
                                rows="3"
                                value={formData.message}
                                onChange={(e) => setFormData({...formData, message: e.target.value})}
                                className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500"
                                required
                            ></textarea>
                            <button type="submit" className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition">
                                मैसेज भेजें 🚀
                            </button>
                        </form>
                    )}
                </section>
            );
        }

        // 7. Main App Component
        function MainApp() {
            const [selectedProject, setSelectedProject] = React.useState(null);

            return (
                <div className="pb-8">
                    <Hero />
                    <Skills />
                    <Projects onOpenModal={(project) => setSelectedProject(project)} />
                    <Contact />
                    
                    {/* Modal Window */}
                    <ProjectModal 
                        project={selectedProject} 
                        onClose={() => setSelectedProject(null)} 
                    />

                    <footer className="text-center text-xs text-slate-500 mt-6 border-t border-slate-900 pt-6">
                        © 2026 Mayank Kumar. Built with React & Tailwind CSS.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
