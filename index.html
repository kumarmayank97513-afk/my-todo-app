<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayank Kumar | Full-Stack Developer</title>
    <!-- React, ReactDOM, Babel & Tailwind CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        // 1. Hero Component
        function Hero() {
            return (
                <section className="text-center py-12 px-4 border-b border-slate-800">
                    <div className="w-24 h-24 bg-sky-500 rounded-full mx-auto flex items-center justify-center text-3xl font-bold text-slate-950 mb-4 shadow-lg shadow-sky-500/20">
                        MK
                    </div>
                    <h1 className="text-3xl font-extrabold text-white sm:text-4xl">
                        Mayank Kumar
                    </h1>
                    <p className="text-sky-400 font-medium mt-1">Full-Stack Web Developer</p>
                    <p className="text-slate-400 text-sm mt-3 max-w-md mx-auto">
                        मैं HTML, CSS, Tailwind, JavaScript और React.js का इस्तेमाल करके मॉडर्न वेब एप्लिकेशन्स बनाता हूँ।
                    </p>
                    <div className="mt-6 flex justify-center gap-3">
                        <a href="#projects" className="bg-sky-500 hover:bg-sky-400 text-slate-950 px-5 py-2 rounded-xl font-bold text-sm transition">
                            प्रोजेक्ट्स देखें
                        </a>
                        <a href="#contact" className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-5 py-2 rounded-xl font-bold text-sm border border-slate-700 transition">
                            संपर्क करें
                        </a>
                    </div>
                </section>
            );
        }

        // 2. Skills Component
        function Skills() {
            const skillsList = ['HTML5', 'CSS3', 'Tailwind CSS', 'JavaScript (ES6)', 'React.js', 'Fetch API', 'GitHub'];
            return (
                <section id="skills" className="py-10 px-4 border-b border-slate-800 max-w-2xl mx-auto">
                    <h2 className="text-xl font-bold text-sky-400 mb-4 text-center">My Tech Stack</h2>
                    <div className="flex flex-wrap justify-center gap-2">
                        {skillsList.map((skill, index) => (
                            <span key={index} className="bg-slate-900 border border-slate-800 text-slate-300 text-xs px-3.5 py-2 rounded-xl font-medium">
                                ⚡ {skill}
                            </span>
                        ))}
                    </div>
                </section>
            );
        }

        // 3. Project Card Component
        function ProjectCard({ title, desc, tech }) {
            return (
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between hover:border-sky-500/50 transition">
                    <div>
                        <h3 className="text-lg font-bold text-white mb-1">{title}</h3>
                        <p className="text-slate-400 text-xs mb-3 leading-relaxed">{desc}</p>
                        <div className="flex flex-wrap gap-1.5 mb-4">
                            {tech.map((t, idx) => (
                                <span key={idx} className="text-[10px] bg-slate-800 text-sky-300 px-2 py-0.5 rounded-md">
                                    {t}
                                </span>
                            ))}
                        </div>
                    </div>
                    <button className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2 rounded-xl font-semibold border border-slate-700 transition">
                        View Details
                    </button>
                </div>
            );
        }

        // 4. Projects Showcase Section
        function Projects() {
            const myProjects = [
                {
                    title: 'Live Weather App',
                    desc: 'Fetch API का उपयोग करके किसी भी शहर का रियल-टाइम तापमान और मौसम अपडेट दिखाने वाला ऐप।',
                    tech: ['HTML', 'CSS', 'JavaScript', 'Fetch API']
                },
                {
                    title: 'To-Do List (LocalStorage)',
                    desc: 'टास्क ऐड, डिलीट और ब्राउज़र लोकल स्टोरेज में स्थायी डेटा सेव करने वाला React To-Do ऐप।',
                    tech: ['React.js', 'Tailwind CSS', 'LocalStorage']
                },
                {
                    title: 'MAYANK.DEV Portfolio',
                    desc: 'मेरा पर्सनल डेवलपर पोर्टफोलियो जो React कंपोनेंट्स और dynamic UI पर बना है।',
                    tech: ['React.js', 'Tailwind CSS', 'GitHub Pages']
                }
            ];

            return (
                <section id="projects" className="py-10 px-4 border-b border-slate-800 max-w-2xl mx-auto">
                    <h2 className="text-xl font-bold text-sky-400 mb-6 text-center">Featured Projects</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {myProjects.map((p, index) => (
                            <ProjectCard key={index} title={p.title} desc={p.desc} tech={p.tech} />
                        ))}
                    </div>
                </section>
            );
        }

        // 5. NEW: Contact Form Component with State
        function Contact() {
            const [formData, setFormData] = React.useState({ name: '', email: '', message: '' });
            const [submitted, setSubmitted] = React.useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if(formData.name && formData.message) {
                    setSubmitted(true);
                }
            };

            return (
                <section id="contact" className="py-10 px-4 max-w-md mx-auto">
                    <h2 className="text-xl font-bold text-sky-400 mb-2 text-center">Get In Touch</h2>
                    <p className="text-slate-400 text-xs text-center mb-6">मुझसे संपर्क करने के लिए नीचे फ़ॉर्म भरें</p>

                    {submitted ? (
                        <div className="bg-emerald-500/10 border border-emerald-500/30 p-4 rounded-xl text-center text-emerald-400 text-sm">
                            ✅ धन्यवाद {formData.name}! आपका मैसेज प्राप्त हो गया है।
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <input 
                                type="text" 
                                placeholder="आपका नाम" 
                                value={formData.name}
                                onChange={(e) => setFormData({...formData, name: e.target.value})}
                                className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500"
                                required 
                            />
                            <input 
                                type="email" 
                                placeholder="ईमेल आईडी" 
                                value={formData.email}
                                onChange={(e) => setFormData({...formData, email: e.target.value})}
                                className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500"
                                required 
                            />
                            <textarea 
                                placeholder="आपका संदेश..." 
                                rows="3"
                                value={formData.message}
                                onChange={(e) => setFormData({...formData, message: e.target.value})}
                                className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500"
                                required
                            ></textarea>
                            <button type="submit" className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition">
                                मैसेज भेजें 🚀
                            </button>
                        </form>
                    )}
                </section>
            );
        }

        // 6. Main App Component
        function MainApp() {
            return (
                <div className="pb-8">
                    <Hero />
                    <Skills />
                    <Projects />
                    <Contact />
                    <footer className="text-center text-xs text-slate-500 mt-6 border-t border-slate-900 pt-6">
                        © 2026 Mayank Kumar. Built with React & Tailwind CSS.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
